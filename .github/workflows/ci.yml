name: CI

# Every check that must pass before a feature or fix is considered done.
# The upstream workflows only run on master/release branches; this one covers main.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type check
            command: build:check
          - name: Unit tests
            command: test
          - name: ESLint
            command: lint
          - name: Stylelint
            command: stylelint
          - name: Production build and ES5 check
            command: build:es-check

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run ${{ matrix.name }}
        run: npm run ${{ matrix.command }}

  # One status to look at: green only when every check above passed
  all-checks:
    name: All checks passed
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every check succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more checks failed: ${{ needs.check.result }}"
            exit 1
          fi
          echo "All checks passed"
